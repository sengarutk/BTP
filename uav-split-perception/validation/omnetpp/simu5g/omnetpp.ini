# OMNeT++ 6.3 / INET 4.5.4 / Simu5G 1.6.0 (also run with 1.5.2) validation scenarios (see validation/README.md).
#
#   O1  RateVsSinr         one UAV (UE) saturating the 5G NR uplink at a sweep of distances:
#                          uplink goodput versus the SINR measured by the gNB, to compare with the
#                          TR 36.942 mapping used by our traces and with ns-3 LTE (V2).
#   O2  CellSharing        N UAVs at the same SINR, all saturated, sharing one gNB uplink with the
#                          proportional-fair scheduler: does each get C/N, as water-filling predicts?
#   O2b CellSharingMixed   half of the UAVs ask for a small constant rate, half are saturated:
#                          water-filling predicts the small demands are met in full and the rest of
#                          the capacity is split equally among the saturated UAVs.
#
# Based on simulations/nr/standalone of Simu5G (demo.xml is copied from there).

[General]
network = simu5g.simulations.nr.networks.SingleCell_Standalone
sim-time-limit = 6s
warmup-period = 1s
seed-set = ${repetition}
repeat = 3
**.routingRecorder.enabled = false
**.vector-recording = false
output-scalar-file = ${resultdir}/${configname}-${iterationvarsf}r${repetition}.sca
output-vector-file = ${resultdir}/${configname}-${iterationvarsf}r${repetition}.vec
*.configurator.config = xmldoc("demo.xml")

# 20 MHz NR carrier at 3.5 GHz: numerology 1 (30 kHz subcarriers), 51 resource blocks.
*.carrierAggregation.componentCarrier[0].carrierFrequency = 3.5GHz
*.carrierAggregation.componentCarrier[0].numerologyIndex = 1
*.carrierAggregation.componentCarrier[0].numBands = 51
**.numBands = 51

**.ueTxPower = 23dBm
**.eNodeBTxPower = 40dBm
**.targetBler = 0.01

# Deterministic large-scale channel so that each distance has one SINR: line of sight, no
# shadowing, no fast fading (fading and shadowing are validated separately, see tests).
**.channelModel[*].shadowing = false
**.channelModel[*].fading = false
**.channelModel[*].fixedLos = true
**.channelModel[*].tolerateMaxDistViolation = true
**.mac.schedulingDisciplineUl = "PF"
**.mac.schedulingDisciplineDl = "PF"

*.gnb.mobility.initialX = 500m
*.gnb.mobility.initialY = 500m
**.mobility.constraintAreaMaxX = 20000m
**.mobility.constraintAreaMaxY = 20000m
**.mobility.constraintAreaMinX = 0m
**.mobility.constraintAreaMinY = 0m
**.mobility.initFromDisplayString = false
*.ue[*].servingNodeId = 0
*.ue[*].nrServingNodeId = 1

# One UDP flow per UAV to the server; the server has one sink per UAV.
*.ue[*].numApps = 1
*.ue[*].app[0].typename = "UdpBasicApp"
*.ue[*].app[0].destAddresses = "server"
*.ue[*].app[0].destPort = 3000 + ancestorIndex(1)
*.ue[*].app[0].localPort = 4000
*.ue[*].app[0].messageLength = 1400B
*.ue[*].app[0].startTime = uniform(0.01s, 0.02s)
*.server.numApps = parent.numUe
*.server.app[*].typename = "UdpSink"
*.server.app[*].localPort = 3000 + ancestorIndex(0)

[Config RateVsSinr]
*.numUe = 1
*.ue[0].mobility.initialX = 500m + ${d=25, 50, 100, 200, 400, 700, 1000, 1500, 2000, 3000, 4000, 6000, 8000}m
*.ue[0].mobility.initialY = 500m
# 0.05 ms between 1400-byte datagrams offers 224 Mbit/s, far above what 20 MHz can carry.
*.ue[0].app[0].sendInterval = 0.05ms

[Config CellSharing]
*.numUe = ${N=1, 2, 5, 10, 20}
# All UAVs on a circle around the gNB, so they have the same SINR.
*.ue[*].mobility.initialX = 500m + 300m * cos(2 * 3.141592653589793 * ancestorIndex(1) / ${N})
*.ue[*].mobility.initialY = 500m + 300m * sin(2 * 3.141592653589793 * ancestorIndex(1) / ${N})
# Each UAV offers max(20, 150/N) Mbit/s: above its fair share C/N at every N (C ~ 116 Mbit/s), so every
# UAV is saturated. (Offering far more than the share makes Simu5G 1.6.0 queue without bound and run
# out of memory at N >= 10.)
*.ue[*].app[0].sendInterval = 1400 * 8 / (max(20, 150 / ${N}) * 1e6) * 1s

[Config CellSharingMixed]
*.numUe = 10
*.ue[*].mobility.initialX = 500m + 300m * cos(2 * 3.141592653589793 * ancestorIndex(1) / 10)
*.ue[*].mobility.initialY = 500m + 300m * sin(2 * 3.141592653589793 * ancestorIndex(1) / 10)
# UAVs 0-4 ask for ${rate} Mbit/s each; UAVs 5-9 offer 40 Mbit/s, above their share (saturated).
*.ue[*].app[0].sendInterval = (ancestorIndex(1) < 5 ? 1400 * 8 / (${rate=1, 2, 4} * 1e6) * 1s : 0.28ms)

#------------------------------------------------------------------------------------------------
# O3  FrameStream: perception frames over the full 5G stack, with the frame logic of the Python
#     simulator (validation/omnetpp/uavapp). N UAVs on a 300 m circle (same SINR), one frame
#     stream per UAV. The configuration (payload, onboard and server times) and the scheduler are
#     set on the command line by validation/run_omnetpp_stream.py.
[Config FrameStream]
sim-time-limit = 31s
warmup-period = 0s
*.numUe = ${N=1, 2, 5, 10, 20}
*.ue[*].mobility.initialX = 500m + 300m * cos(2 * 3.141592653589793 * ancestorIndex(1) / ${N})
*.ue[*].mobility.initialY = 500m + 300m * sin(2 * 3.141592653589793 * ancestorIndex(1) / ${N})
*.ue[*].app[0].typename = "uavvalidation.FrameSender"
*.ue[*].app[0].destAddress = "server"
*.ue[*].app[0].destPort = 3000 + ancestorIndex(1)
*.ue[*].app[0].localPort = 5000
*.ue[*].app[0].startTime = 1s + uniform(0s, 0.033s)
*.ue[*].app[0].payloadBytes = 317849
*.ue[*].app[0].onboardMs = 77.3
*.ue[*].app[0].cloudMs = 11.0
*.server.app[*].typename = "uavvalidation.FrameSink"
*.server.app[*].localPort = 3000 + ancestorIndex(0)
