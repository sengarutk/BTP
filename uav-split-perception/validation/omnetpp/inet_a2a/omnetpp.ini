# O4: 802.11ac air-to-air goodput versus distance in INET 4.5.4, with the radio assumptions of the
# Python A2A model and the ns-3 scenario (validation/ns3/a2a_wifi.cc --standard=ac):
# 20 dBm, 5.785 GHz, 20 MHz, one stream, log-distance path loss (exponent 2.2, free space at 1 m),
# -95 dBm noise, SNR-limited receiver, 4 dB detection threshold, saturated UDP, fixed MCS per run.
[General]
network = inetvalidation.A2A
sim-time-limit = 4s
warmup-period = 1s
**.vector-recording = false
output-scalar-file = ${resultdir}/${configname}-${iterationvarsf}r${repetition}.sca
**.constraintAreaMinX = 0m
**.constraintAreaMinY = 0m
**.constraintAreaMinZ = 0m
**.constraintAreaMaxX = 2000m
**.constraintAreaMaxY = 100m
**.constraintAreaMaxZ = 100m
*.uav[*].mobility.typename = "StationaryMobility"  # not **: that would also give each antenna its own mobility
*.uav[*].mobility.initFromDisplayString = false
*.uav[*].mobility.initialY = 50m
*.uav[*].mobility.initialZ = 80m
*.uav[0].mobility.initialX = 0m
*.uav[1].mobility.initialX = ${d=10, 25, 50, 75, 100, 150, 200, 250, 300, 350, 400, 500, 600, 700, 800}m

*.radioMedium.pathLoss.typename = "LogNormalShadowing"
*.radioMedium.pathLoss.alpha = 2.2
*.radioMedium.pathLoss.sigma = 0
*.radioMedium.backgroundNoise.power = -95dBm
*.radioMedium.backgroundNoise.bandwidth = 20MHz

**.wlan[*].opMode = "ac"
# channel 157 (5.785 GHz), 20 MHz: the "5 GHz" band numbers channels in 5 MHz steps from 5 GHz
**.wlan[*].radio.bandName = "5 GHz"
**.wlan[*].radio.channelNumber = 157
**.wlan[*].radio.bandwidth = 20MHz
**.wlan[*].radio.receiver.bandwidth = 20MHz
**.wlan[*].radio.transmitter.power = 100mW
**.wlan[*].radio.receiver.sensitivity = -100dBm
# energy detection must lie above the -95 dBm noise; reception needs SNIR >= 4 dB (-91 dBm) anyway
**.wlan[*].radio.receiver.energyDetection = -92dBm
**.wlan[*].radio.receiver.snirThreshold = 4dB
# VHT, 20 MHz, 1 spatial stream, 800 ns guard interval: MCS 0..8
**.wlan[*].mac.*.rateSelection.dataFrameBitrate = ${rate=6.5, 13, 19.5, 26, 39, 52, 58.5, 65, 78}Mbps
# control and broadcast frames keep their default basic rates; addresses are resolved statically
**.arp.typename = "GlobalArp"

*.uav[0].numApps = 1
*.uav[0].app[0].typename = "UdpBasicApp"
*.uav[0].app[0].destAddresses = "uav[1]"
*.uav[0].app[0].destPort = 5000
*.uav[0].app[0].messageLength = 1472B
*.uav[0].app[0].sendInterval = 0.05ms
*.uav[0].app[0].startTime = 0.5s
*.uav[1].numApps = 1
*.uav[1].app[0].typename = "UdpSink"
*.uav[1].app[0].localPort = 5000
