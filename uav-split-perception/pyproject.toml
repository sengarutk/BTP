[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-uav"
version = "2.0.0"
description = "Split computing vs. image offloading for real-time UAV object detection: tooling and trace-driven evaluation"
authors = [{ name = "Utkarsh Sengar", email = "cs23bt026@iitdh.ac.in" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "ultralytics>=8.3",
    "numpy>=1.23,<2.0",
    "opencv-python>=4.8",
    "pyzmq>=24.0",
    "zstandard>=0.21",
    "thop>=0.1.1",
    "tabulate>=0.9",
    "matplotlib>=3.6",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "pipeline*", "protocol*", "quantization*", "simulation*", "evaluation*", "utils*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:thop.*:"]
