[General]
network = AegisSwarm
sim-time-limit = 120s
cpu-time-limit = 3600s
total-stack = 64MiB
cmdenv-express-mode = true
cmdenv-autoflush = true
cmdenv-status-frequency = 10s

# Visualizer Configuration
*.visualizer.*.routingTableVisualizer.displayRoutes = true
*.visualizer.*.mediumVisualizer.displaySignals = false
*.visualizer.*.networkRouteVisualizer.displayRoutes = true
*.visualizer.*.physicalLinkVisualizer.displayLinks = true

# Network Configuration
*.configurator.config = xmldoc("network_config.xml")

# Physical Radio Mediums
*.cellularRadioMedium.pathLoss.typename = "LogNormalShadowing"
*.cellularRadioMedium.pathLoss.pathLossExponent = 2.4
*.cellularRadioMedium.pathLoss.sigma = 4.0

*.a2aRadioMedium.pathLoss.typename = "LogNormalShadowing"
*.a2aRadioMedium.pathLoss.pathLossExponent = 2.2
*.a2aRadioMedium.pathLoss.sigma = 3.0

# -----------------------------------------------------------------------------
# Base Station & Ground Cloud Server
# -----------------------------------------------------------------------------
*.gNodeB.numEthInterfaces = 1
*.groundStation.numEthInterfaces = 1

# -----------------------------------------------------------------------------
# UAV Node Architecture & Calibrated Hardware Parameters
# -----------------------------------------------------------------------------
*.uav[*].frameRateFps = 30.0fps
*.uav[*].frameIntervalMs = 33.33ms
*.uav[*].maxQueueDepth = 30

# Calibrated Power & Energy (Jetson Nano + C-Band RF)
*.uav[*].aCoeffEdge = 11.2330
*.uav[*].bCoeffTx = 3.8000
*.uav[*].pIdleW = 2.20W
*.uav[*].pMaxW = 10.00W
*.uav[*].pTxRfW = 3.80W
*.uav[*].pAvionicsW = 15.00W
*.uav[*].batteryCapacityWh = 55.5Wh

# Dynamic Split Optimizer (Alpha=0.4, Beta=0.4, Gamma=0.2, Deadline=300ms)
*.uav[*].alphaWeight = 0.40
*.uav[*].betaWeight = 0.40
*.uav[*].gammaWeight = 0.20
*.uav[*].deadlineMs = 300.0ms
*.uav[*].hysteresisDelta = 0.05

# -----------------------------------------------------------------------------
# Wireless Interfaces & MAC Configuration
# -----------------------------------------------------------------------------
# 802.11ax Wi-Fi 6 A2A Mesh (Radio 0 @ 5.8 GHz)
*.uav[*].wlan[0].typename = "Ieee80211Interface"
*.uav[*].wlan[0].radio.typename = "Ieee80211ScalarRadio"
*.uav[*].wlan[0].radio.carrierFrequency = 5.8GHz
*.uav[*].wlan[0].radio.bandwidth = 20MHz
*.uav[*].wlan[0].radio.transmitter.power = 100mW
*.uav[*].wlan[0].radio.receiver.sensitivity = -95dBm
*.uav[*].wlan[0].mac.typename = "Ieee80211Mac"

# -----------------------------------------------------------------------------
# Mobility Model Configurations
# -----------------------------------------------------------------------------
# Formation Grid Mobility (Default)
*.uav[*].mobility.typename = "LinearMobility"
*.uav[*].mobility.speed = 10mps
*.uav[*].mobility.constraintAreaMinX = 0m
*.uav[*].mobility.constraintAreaMaxX = 2000m
*.uav[*].mobility.constraintAreaMinY = 0m
*.uav[*].mobility.constraintAreaMaxY = 2000m
*.uav[*].mobility.constraintAreaMinZ = 50m
*.uav[*].mobility.constraintAreaMaxZ = 150m

# =============================================================================
# Parameterized Swarm Scaling Scenarios (N = 3, 5, 10, 20, 30, 50)
# =============================================================================

[Config Swarm_N3]
description = "AEGIS-UAV Swarm Scale: 3 UAV Nodes"
*.numUavs = 3
*.cellCapacityMbps = 200.0

[Config Swarm_N5]
description = "AEGIS-UAV Swarm Scale: 5 UAV Nodes"
*.numUavs = 5
*.cellCapacityMbps = 200.0

[Config Swarm_N10]
description = "AEGIS-UAV Swarm Scale: 10 UAV Nodes (Nominal Baseline)"
*.numUavs = 10
*.cellCapacityMbps = 200.0

[Config Swarm_N20]
description = "AEGIS-UAV Swarm Scale: 20 UAV Nodes"
*.numUavs = 20
*.cellCapacityMbps = 250.0

[Config Swarm_N30]
description = "AEGIS-UAV Swarm Scale: 30 UAV Nodes (High Density)"
*.numUavs = 30
*.cellCapacityMbps = 300.0

[Config Swarm_N50]
description = "AEGIS-UAV Swarm Scale: 50 UAV Nodes (Maximum Swarm Stress Test)"
*.numUavs = 50
*.cellCapacityMbps = 300.0

# =============================================================================
# Mobility Variations (Random Waypoint)
# =============================================================================
[Config Swarm_RWP_Mobility]
description = "Random Waypoint 3D Spatial Mobility in 1km x 1km Airspace"
*.numUavs = 10
*.uav[*].mobility.typename = "RandomWaypointMobility"
*.uav[*].mobility.speed = uniform(5mps, 15mps)
*.uav[*].mobility.waitTime = uniform(1s, 5s)
*.uav[*].mobility.constraintAreaMinX = 50m
*.uav[*].mobility.constraintAreaMaxX = 950m
*.uav[*].mobility.constraintAreaMinY = 50m
*.uav[*].mobility.constraintAreaMaxY = 950m
*.uav[*].mobility.constraintAreaMinZ = 50m
*.uav[*].mobility.constraintAreaMaxZ = 150m

# =============================================================================
# 3GPP Channel Trace Scenarios
# =============================================================================
[Config 5G_Channel_Good]
description = "High-SINR LOS 5G Channel Trace (Mean BW: 75 Mbps)"
*.uav[*].app[0].traceFile = "traces/trace_5g_good.csv"

[Config 5G_Channel_Moderate]
description = "Typical Urban Macro 5G Channel Trace (Mean BW: 20 Mbps)"
*.uav[*].app[0].traceFile = "traces/trace_5g_moderate.csv"

[Config 5G_Channel_Vehicular_Fading]
description = "High Doppler Rayleigh Fast Fading 5G Trace"
*.uav[*].app[0].traceFile = "traces/trace_5g_vehicular_fading.csv"

[Config 5G_Channel_Blackout]
description = "Transient NLOS Shadowing & Blackout Trace with A2A Auction Relaying"
*.uav[*].app[0].traceFile = "traces/trace_5g_blackout.csv"
